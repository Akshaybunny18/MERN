
services:

  backend:
    build: ./backend

    ports:
      - "5000:5000"
    
    depends_on:
    - mongodb

    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017/
      DATABASE_NAME: mern

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    container_name: mern-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    stdin_open: true
    tty: true

  mongodb:
    image: mongo:8

    container_name: mongodb

    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

    volumes:
      - mongo-data:/data/db

  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend
      - frontend

